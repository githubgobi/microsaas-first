[pytest]
asyncio_mode = auto
# Share one event loop across the full test session so session-scoped async
# fixtures (create_schema, etc.) run in the same loop as function-scoped ones.
asyncio_default_fixture_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
