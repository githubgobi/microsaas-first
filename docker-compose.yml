services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed locally for psql / pgAdmin access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      # Override so the container reaches the 'db' service, not localhost
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/saas_db
    depends_on:
      db:
        condition: service_healthy
    # One-shot: exits 0 on success, non-zero on failure — compose surfaces the error
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/saas_db
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
